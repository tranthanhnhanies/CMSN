<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%">
  <defs>
    <filter id="stampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#553c29" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Perforated Stamp Base -->
  <g filter="url(#stampShadow)">
    <rect x="10" y="10" width="140" height="180" fill="#fdfbf7" stroke="#e6d5c3" stroke-width="1.5"/>
    <rect x="18" y="18" width="124" height="164" fill="#faedcd" stroke="#d4a373" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Flower / Heart Stamp Artwork -->
    <circle cx="80" cy="85" r="35" fill="#fefae0" stroke="#ccd5ae" stroke-width="1.5"/>
    
    <!-- Rose / Floral center -->
    <path d="M 80 70 C 70 58, 58 72, 80 95 C 102 72, 90 58, 80 70 Z" fill="#e07a5f"/>
    <path d="M 80 75 C 75 66, 66 76, 80 90 C 94 76, 85 66, 80 75 Z" fill="#d00000" opacity="0.6"/>

    <path d="M 80 95 Q 75 110 80 120" stroke="#606c38" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 78 104 Q 65 100 68 92 Q 78 98 78 104 Z" fill="#606c38"/>
    <path d="M 80 110 Q 94 108 92 100 Q 82 104 80 110 Z" fill="#606c38"/>

    <!-- Stamp Postmark Lines / Airmail text -->
    <text x="80" y="145" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#8d6e63" text-anchor="middle" letter-spacing="1">SPECIAL</text>
    <text x="80" y="160" font-family="'Courier New', monospace" font-size="9" fill="#a1887f" text-anchor="middle" letter-spacing="1.5">AIR MAIL</text>
    <text x="80" y="38" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#b08968" text-anchor="middle">★ 10-03 ★</text>
  </g>
</svg>
