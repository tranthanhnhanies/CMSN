<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1e6"/>
      <stop offset="100%" stop-color="#fde2e4"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#fab1a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fde2e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cakeCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf0ed"/>
    </linearGradient>
    <linearGradient id="cakeBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c2a8"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad2)"/>

  <!-- Warm ambient glow -->
  <circle cx="300" cy="220" r="140" fill="url(#candleGlow)" filter="url(#softGlow)"/>

  <!-- Table surface -->
  <ellipse cx="300" cy="480" rx="220" ry="25" fill="#e9d8a6" opacity="0.6"/>

  <!-- Cake Stand -->
  <ellipse cx="300" cy="460" rx="160" ry="18" fill="#e5e5e5"/>
  <rect x="285" y="460" width="30" height="35" rx="5" fill="#cccccc"/>
  <ellipse cx="300" cy="495" rx="70" ry="10" fill="#bbbbbb"/>

  <!-- Cake Bottom Layer -->
  <rect x="170" y="360" width="260" height="90" rx="12" fill="url(#cakeBase)"/>
  <ellipse cx="300" cy="360" rx="130" ry="22" fill="url(#cakeCream)"/>

  <!-- Cream drip detail -->
  <path d="M 170 370 Q 185 395 200 370 Q 215 405 235 370 Q 260 400 285 370 Q 315 408 340 370 Q 365 400 390 370 Q 415 395 430 370 L 430 360 L 170 360 Z" fill="url(#cakeCream)"/>

  <!-- Strawberries / Cherries on bottom tier -->
  <circle cx="210" cy="355" r="12" fill="#d90429"/>
  <circle cx="255" cy="362" r="13" fill="#ef233c"/>
  <circle cx="300" cy="365" r="14" fill="#d90429"/>
  <circle cx="345" cy="362" r="13" fill="#ef233c"/>
  <circle cx="390" cy="355" r="12" fill="#d90429"/>

  <!-- Cake Top Layer -->
  <rect x="210" y="270" width="180" height="80" rx="10" fill="url(#cakeBase)"/>
  <ellipse cx="300" cy="270" rx="90" ry="18" fill="url(#cakeCream)"/>
  <path d="M 210 280 Q 230 300 250 280 Q 275 305 300 280 Q 325 305 350 280 Q 370 300 390 280 L 390 270 L 210 270 Z" fill="url(#cakeCream)"/>

  <!-- Candles -->
  <rect x="294" y="195" width="12" height="65" rx="4" fill="#ffb703"/>
  <!-- Candle Stripe -->
  <path d="M 294 210 L 306 205 M 294 225 L 306 220 M 294 240 L 306 235" stroke="#fb8500" stroke-width="2"/>
  <line x1="300" y1="195" x2="300" y2="185" stroke="#333" stroke-width="2"/>

  <!-- Flame -->
  <path d="M 300 150 C 288 170, 290 185, 300 186 C 310 185, 312 170, 300 150 Z" fill="#ffb703"/>
  <path d="M 300 160 C 294 172, 295 183, 300 184 C 305 183, 306 172, 300 160 Z" fill="#d90429"/>

  <!-- Sparkles -->
  <path d="M 170 180 L 175 190 L 185 195 L 175 200 L 170 210 L 165 200 L 155 195 L 165 190 Z" fill="#ffb703" opacity="0.8"/>
  <path d="M 430 190 L 434 198 L 442 202 L 434 206 L 430 214 L 426 206 L 418 202 L 426 198 Z" fill="#ffb703" opacity="0.8"/>
  <path d="M 390 130 L 393 136 L 399 139 L 393 142 L 390 148 L 387 142 L 381 139 L 387 136 Z" fill="#f4a261" opacity="0.7"/>
</svg>
