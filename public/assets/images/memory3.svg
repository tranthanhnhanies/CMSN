<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="60%" stop-color="#4a4e69"/>
      <stop offset="100%" stop-color="#8d99ae"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeedd" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffe5b4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a4e69" stop-opacity="0"/>
    </radialGradient>
    <filter id="mBlur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="600" fill="url(#nightGrad)"/>

  <!-- Moon Glow & Moon -->
  <circle cx="440" cy="160" r="100" fill="url(#moonGlow)" filter="url(#mBlur)"/>
  <circle cx="440" cy="160" r="45" fill="#fff3b0"/>
  <circle cx="425" cy="150" r="38" fill="url(#nightGrad)" opacity="0.3"/>

  <!-- Tiny Twinkling Stars -->
  <circle cx="120" cy="100" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="180" cy="150" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="260" cy="90" r="3" fill="#ffeaa7" opacity="0.9"/>
  <circle cx="330" cy="140" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="90" cy="220" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="230" cy="240" r="1.5" fill="#ffeaa7" opacity="0.8"/>
  <circle cx="510" cy="80" r="2" fill="#ffffff" opacity="0.85"/>
  <circle cx="530" cy="240" r="2.5" fill="#ffeaa7" opacity="0.75"/>

  <!-- Star Crosses -->
  <path d="M 150 190 L 150 206 M 142 198 L 158 198" stroke="#ffeaa7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 370 80 L 370 94 M 363 87 L 377 87" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cozy Window sill / Table -->
  <rect x="0" y="440" width="600" height="160" fill="#3d312a"/>
  <rect x="0" y="440" width="600" height="16" fill="#584638"/>

  <!-- Coffee Cup / Mug -->
  <ellipse cx="220" cy="460" rx="36" ry="10" fill="#2b231d" opacity="0.4"/>
  <rect x="185" y="400" width="70" height="60" rx="10" fill="#e9ecef"/>
  <ellipse cx="220" cy="400" rx="35" ry="12" fill="#d8dbe0"/>
  <ellipse cx="220" cy="400" rx="28" ry="9" fill="#6f4e37"/>
  <!-- Mug Handle -->
  <path d="M 255 410 C 275 415, 275 445, 255 450" fill="none" stroke="#e9ecef" stroke-width="8" stroke-linecap="round"/>

  <!-- Heart on mug -->
  <path d="M 220 425 C 217 420, 210 420, 210 426 C 210 432, 220 439, 220 442 C 220 439, 230 432, 230 426 C 230 420, 223 420, 220 425 Z" fill="#e76f51"/>

  <!-- Steam -->
  <path d="M 210 380 Q 205 365 212 350" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 228 385 Q 235 370 225 355" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Small potted plant on table -->
  <polygon points="360,460 385,460 380,420 365,420" fill="#e76f51"/>
  <!-- leaves -->
  <path d="M 372 420 Q 350 400 345 385 Q 365 390 372 420" fill="#84a59d"/>
  <path d="M 373 420 Q 395 395 405 380 Q 388 395 373 420" fill="#84a59d"/>
  <path d="M 372 420 Q 372 385 370 370 Q 378 390 372 420" fill="#6b9080"/>
</svg>
